<main id="isi" tabindex="-1"><noscript><div class="wrap" style="padding:48px 16px"><h1>Jelajah Klamono</h1><p>Wisata berbasis komunitas di Distrik Klamono, Kabupaten Sorong, Papua Barat Daya, dan pustaka pengetahuan lokal Suku Moi.</p><h2>Pengalaman wisata</h2><ul><li>Trekking Hutan Klawosom</li><li>Ikut berburu cara tradisional</li><li>Rumah Persemaian dan Agroforestri Bina Brawijaya</li><li>Pengamatan burung di Mlais</li><li>Kerajinan tangan Wariyau</li><li>Tokok sagu di Klawana</li><li>Tokok sagu di Klalomon</li><li>Telusur sungai & wisata buaya</li><li>Sanggar tari</li><li>Klamonovasi, galeri produk UMKM</li><li>Budidaya ikan dan pakan</li><li>Produksi abon lele</li><li>Kolam Budidaya Nusantara Jaya</li><li>Klamono Agroliving</li><li>Sumur heritage NNGPM</li></ul><p>Pustaka: 34 tanaman obat Suku Moi, sejarah lokal Klamono, kamus istilah Moi, serta dua buku saku: <a href="assets/buku/buku-saku-tanaman-obat-klamono-raya.pdf">Tanaman Obat Klamono Raya (PDF)</a> dan <a href="assets/buku/buku-saku-sejarah-lokal-klamono-raya.pdf">Sejarah Lokal Klamono Raya (PDF)</a>.</p><h2>Halaman</h2><ul><li><a href="wisata/">Wisata di Klamono</a></li><li><a href="tanaman/">34 tanaman obat Suku Moi</a></li><li><a href="pengetahuan/">Sejarah dan budaya Klamono</a></li><li><a href="kamus/">Kamus istilah Moi</a></li><li><a href="kisah/">Kisah dan berita</a></li></ul><p>Website ini memerlukan JavaScript. / This website needs JavaScript.</p></div></noscript></main>
